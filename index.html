    // --- Deterministic Emergency Triage Engine ---
    function evaluateEmergency(selectedIds, textToScan = '') {
      const triggers = [];
      for (const id of selectedIds) {
        const sign = EMERGENCY_SIGNS.find(s => s.id === id);
        if (sign) triggers.push(`Selected: ${sign.labelEn}`);
      }
      if (textToScan && textToScan.trim()) {
        const lower = textToScan.toLowerCase();
        for (const sign of EMERGENCY_SIGNS) {
          for (const kw of sign.keywords) {
            if (lower.includes(kw.toLowerCase())) {
              triggers.push(`Detected in text: "${kw}" (${sign.labelEn})`);
              break;
            }
          }
        }
      }
      return {
        isEmergency: triggers.length > 0,
        triggers,
        emergencyNumber: '112'
      };
    }

    // --- Grounded Excerpt Verification Engine ---
    function verifySourceExcerpt(sourceText, citedExcerpt) {
      if (!sourceText || !citedExcerpt) {
        return { isVerified: false, confidence: 0, startIndex: -1, endIndex: -1 };
      }
      const cleanedSource = sourceText.trim();
      const cleanedExcerpt = citedExcerpt.trim().replace(/^["']|["']$/g, '');
      if (!cleanedExcerpt) {
        return { isVerified: false, confidence: 0, startIndex: -1, endIndex: -1 };
      }

      // Exact Match
      const exactIdx = cleanedSource.indexOf(cleanedExcerpt);
      if (exactIdx !== -1) {
        return {
          isVerified: true,
          confidence: 1.0,
          startIndex: exactIdx,
          endIndex: exactIdx + cleanedExcerpt.length
        };
      }

      // Case-Insensitive Match
      const lowerSource = cleanedSource.toLowerCase();
      const lowerExcerpt = cleanedExcerpt.toLowerCase();
      const caseIdx = lowerSource.indexOf(lowerExcerpt);
      if (caseIdx !== -1) {
        return {
          isVerified: true,
          confidence: 0.95,
          startIndex: caseIdx,
          endIndex: caseIdx + cleanedExcerpt.length
        };
      }

      // Token Overlap Match
      const excerptWords = cleanedExcerpt.toLowerCase().split(/\s+/).filter(w => w.length > 2);
      const sourceWords = new Set(cleanedSource.toLowerCase().split(/\s+/).filter(w => w.length > 2));
      if (excerptWords.length >= 3) {
        let matched = 0;
        for (const w of excerptWords) {
          if (sourceWords.has(w)) matched++;
        }
        const ratio = matched / excerptWords.length;
        if (ratio >= 0.85) {
          return { isVerified: true, confidence: Number(ratio.toFixed(2)), startIndex: -1, endIndex: -1 };
        }
      }

      return { isVerified: false, confidence: 0.2, startIndex: -1, endIndex: -1 };
    }

                      className="w-full text-center px-4 py-3 rounded-xl bg-red-600 hover:bg-red-700 text-white font-bold text-sm shadow transition"
                    >
                      {lang === 'hi' ? '📞 112 पर कॉल करें' : '📞 Call 112 Emergency'}
                    </a>
                    <button
                      type="button"
                      onClick={handleAcknowledgeEmergency}
                      className="w-full text-center px-4 py-3 rounded-xl border border-slate-300 text-slate-700 hover:bg-slate-100 font-semibold text-xs transition"
                    >
                      {lang === 'hi' ? 'मैं समझ गया - सुरक्षित मोड पर लौटें' : 'I Understand — Return to Safe Mode'}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}

          {/* AUTOMATED TEST SUITE MODAL */}
          {showTestModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-sm" role="dialog" aria-modal="true">
              <div className="bg-white rounded-2xl max-w-3xl w-full border border-slate-200 shadow-2xl overflow-hidden flex flex-col max-h-[85vh]">
                <div className="bg-slate-900 text-white p-4 flex items-center justify-between">
                  <div className="flex items-center gap-2">
                    <Icons.Flask />
                    <div>
                      <h3 className="text-base font-bold">Automated Test Suite (12 Synthetic Scenarios)</h3>
                      <p className="text-xs text-slate-400">Verifying grounding, clinical ambiguity, contradictions, emergency bypass, and multilingual logic</p>
                    </div>
                  </div>
                  <button
                    onClick={() => setShowTestModal(false)}
                    className="text-slate-400 hover:text-white text-sm font-bold p-1"
                  >
                    ✕
                  </button>
                </div>

                <div className="p-4 bg-slate-50 border-b border-slate-200 flex items-center justify-between">
                  <div className="flex items-center gap-3 text-xs font-semibold">
                    <span className="text-emerald-700 bg-emerald-100 px-2.5 py-1 rounded-full">
                      Passed: {testResults.filter(r => r.passed).length} / {testResults.length}
                    </span>
                    {testResults.some(r => !r.passed) && (
                      <span className="text-red-700 bg-red-100 px-2.5 py-1 rounded-full">
                        Failed: {testResults.filter(r => !r.passed).length}
                      </span>
                    )}
                  </div>
                  <button
                    onClick={handleRunTestSuite}
                    disabled={isRunningTests}
                    className="px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold transition flex items-center gap-1.5"
                  >
                    {isRunningTests ? 'Executing tests...' : 'Re-Run All 12 Tests'}
                  </button>
                </div>

                <div className="flex-1 overflow-y-auto p-4 space-y-2.5 text-xs">
                  {testResults.map((t) => (
                    <div
                      key={t.id}
                      className={`p-3 rounded-xl border flex flex-col sm:flex-row sm:items-center justify-between gap-2 ${
                        t.passed ? 'bg-emerald-50/50 border-emerald-200' : 'bg-red-50 border-red-300'
                      }`}
                    >
                      <div>
                        <div className="flex items-center gap-2">
                          <span className={`px-2 py-0.5 rounded text-[10px] font-bold uppercase ${
                            t.passed ? 'bg-emerald-600 text-white' : 'bg-red-600 text-white'
                          }`}>
                            {t.id} • {t.passed ? 'PASSED' : 'FAILED'}
                          </span>
                          <span className="font-bold text-slate-900">{t.name}</span>
                          <span className="text-[10px] text-slate-400 font-mono">({t.category})</span>
                        </div>
                        <p className="text-slate-600 mt-1">{t.details}</p>
                      </div>
                      <div className="text-right text-[11px] font-mono text-slate-400 whitespace-nowrap">
                        {t.durationMs}ms
                      </div>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          )}

          {/* API KEY & MODE CONFIG MODAL */}
          {showApiModal && (
            <div className="fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-950/70 backdrop-blur-sm" role="dialog" aria-modal="true">
              <div className="bg-white rounded-2xl max-w-md w-full border border-slate-200 shadow-2xl overflow-hidden">
                <div className="p-5 border-b border-slate-100 flex items-center justify-between">
                  <h3 className="text-base font-bold text-slate-900">Gemini API & Mode Configuration</h3>
                  <button onClick={() => setShowApiModal(false)} className="text-slate-400 hover:text-slate-700 text-sm font-bold">✕</button>
                </div>

                <div className="p-5 space-y-4 text-xs text-slate-700">
                  <div>
                    <label className="block font-semibold text-slate-800 mb-1.5">Execution Mode:</label>
                    <div className="grid grid-cols-2 gap-2">
                      <button
                        type="button"
                        onClick={() => setApiMode('simulation')}
                        className={`p-2.5 rounded-xl border text-left transition ${apiMode === 'simulation' ? 'border-emerald-500 bg-emerald-50/80 font-bold text-emerald-950' : 'border-slate-200 bg-white text-slate-600'}`}
                      >
                        <div className="font-semibold">Offline Simulation</div>
                        <div className="text-[10px] text-slate-500">Zero setup, instant synthetic verification</div>
                      </button>
                      <button
                        type="button"
                        onClick={() => setApiMode('live')}
                        className={`p-2.5 rounded-xl border text-left transition ${apiMode === 'live' ? 'border-emerald-500 bg-emerald-50/80 font-bold text-emerald-950' : 'border-slate-200 bg-white text-slate-600'}`}
                      >
                        <div className="font-semibold">Live Gemini API</div>
                        <div className="text-[10px] text-slate-500">Real Gemini 2.5/1.5 Flash structured calls</div>
                      </button>
                    </div>
                  </div>

                  {apiMode === 'live' && (
                    <div>
                      <label className="block font-semibold text-slate-800 mb-1">Gemini API Key:</label>
                      <input
                        type="password"
                        value={apiKey}
                        onChange={(e) => setApiKey(e.target.value)}
                        placeholder="AIzaSy..."
                        className="w-full px-3 py-2 rounded-lg border border-slate-300 font-mono text-xs focus:border-emerald-500 focus:ring-1 focus:ring-emerald-500"
                      />
                      <p className="text-[11px] text-slate-500 mt-1">
                        <strong>Security Guarantee:</strong> Your key is stored exclusively in temporary browser memory for this session and is never persisted to localStorage, cookies, or sent to any third party.
                      </p>
                    </div>
                  )}

                  <div className="pt-2 flex justify-end gap-2">
                    <button
                      type="button"
                      onClick={() => setShowApiModal(false)}
                      className="px-4 py-2 rounded-xl bg-emerald-600 text-white font-semibold hover:bg-emerald-700 transition"
                    >
                      Save Configuration
                    </button>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Render App
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<SamajhCareApp />);
  </script>
</body>
</html>
